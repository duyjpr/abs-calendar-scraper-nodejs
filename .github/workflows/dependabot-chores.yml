# Automates chores relating to dependabot:
#
# - Merges dependabot pull requests which only update a minor version.
#   Minor updates can usually be merged without review.
#
# - Bumps dependencies if there are outstanding alerts.
#   This often resolves alerts that have to wait for upstream to update.
#
name: Dependabot chores
on:
  pull_request:
  workflow_dispatch:
  schedule:
  - cron: '5 3 * * 2' # Weekly, early hours of Tuesday
    timezone: 'Australia/Melbourne'

permissions:
  # Merge pull requests
  pull-requests: write
  # Auto-delete branches after merge
  contents: write
  # Read dependabot alerts
  vulnerability-alerts: read

jobs:
  # Auto-merge pull requests from dependabot
  dep_pr:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Auto-merge PR
        # Only on minor updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --merge --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Check for dependabot alerts
  check:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      has_alerts: ${{ steps.check_dependabot.outputs.has_alerts }}
    steps:
    - name: Check dependabot alerts
      id: check_dependabot
      run: |
        answer=$(gh api "/repos/${REPO}/dependabot/alerts?state=open")
        has_alerts=$([[ "[]" != "$answer" ]] && echo true || echo false)
        echo "has_alerts=$has_alerts" >> $GITHUB_OUTPUT
      env:
        REPO: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}

  # Update dependencies if any outstanding dependabot alerts
  update:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.has_alerts == 'true'
    steps:
    - uses: actions/checkout@v7
    - run: npm update
    - name: Auto commit
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Dependency bump (weekly dependabot)" && \
          git push || \
          echo "No updates to push"
